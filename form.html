    <header class="bg-filter border-top border-4 border-primary border-lg-0">

    </header>

    <section class="border-bottom border-4 border-primary border-lg-0">
        <div class="bg-filter border-4 border-primary border-lg-0">
            <div class="py-5 container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <form action="" class="bg-white p-4 p-lg-5 shadow-lg border-top border-5 border-primary rounded-5">
                            <h3 class="mb-5 text-center fw-noto-bold">填寫訂購資訊</h3>
                            <div class="row g-3">
                                <div class="col-lg-6">
                                    <label for="firstName" class="form-label">名字</label>
                                    <input type="text" class="form-control" id="firstName">
                                </div>
                                <div class="col-lg-6">
                                    <label for="lastName" class="form-label">姓氏</label>
                                    <input type="text" class="form-control" id="lastName">
                                </div>
                                <div class="col-12">
                                    <label for="phoneNumber" class="form-label">手機號碼</label>
                                    <input type="tel" class="form-control" id="phoneNumber">
                                </div>
                                <div class="col-12">
                                    <label for="emailAddress" class="form-label">電子郵件</label>
                                    <input type="email" class="form-control" id="emailAddress">
                                </div>
                                <div class="col-12">
                                    <label for="address" class="form-label">收件地址</label>
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <select id="address" class="form-select">
                                                <option selected>請選擇城市</option>
                                                <option value="1">台北市</option>
                                                <option value="2">新北市</option>
                                                <option value="3">台中市</option>
                                                <option value="4">台南市</option>
                                                <option value="5">高雄市</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <select id="address" class="form-select">
                                                <option selected>請選擇區域</option>
                                                <option value="1">AA區</option>
                                                <option value="2">BB區</option>
                                                <option value="3">CC區</option>
                                                <option value="4">DD區</option>
                                                <option value="5">EE區</option>
                                            </select>
                                        </div>
                                        <div class="col-12 mt-2">
                                            <input type="text" class="form-control" placeholder="請輸入詳細地址" id="address">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label for="designerSelect" class="form-label">選擇設計師風格</label>
                                    <select id="designerSelect" class="form-select">
                                        <option selected>Meili</option>
                                        <option value="1">Zoe</option>
                                        <option value="2">Michael</option>
                                        <option value="3">Birdy</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <p class="mb-0">加購服務</p>
                                    <div class="from-check my-2">
                                        <input class="form-check-input" type="checkbox" id="gridCheck01">
                                        <label class="form-check-label" for="gridCheck01">
                                            送禮用包裝+100
                                        </label>
                                    </div>
                                    <div class="from-check my-2">
                                        <input class="form-check-input" type="checkbox" id="gridCheck02">
                                        <label class="form-check-label" for="gridCheck02">
                                            無框畫+250
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label for="memo" class="form-label">備註說明</label>
                                    <textarea class="form-control" id="memo" rows="4" style="resize: none;"></textarea>
                                </div>
                                <div class="col-12 d-flex flex-column align-items-center">
                                    <p class="fw-noto-bold h4 my-5">總金額 NT$ 300</p>
                                    <button type="submit" class="btn btn-primary btn-lg w-50">送出訂購資訊</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
